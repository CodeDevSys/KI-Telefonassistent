services:
  - type: web
    name: salon-ai-assistant
    runtime: node
    rootDir: salon-ai-assistant
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: salon-ai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: SQLITE_PATH
        value: /var/data/salon.sqlite
      - key: PUBLIC_BASE_URL
        value: https://salon-ai-assistant.onrender.com
      - key: OPENAI_REALTIME_MODEL
        value: gpt-4o-realtime-preview
      - key: OPENAI_REALTIME_VOICE
        value: alloy
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_VALIDATE_WEBHOOKS
        value: "false"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
